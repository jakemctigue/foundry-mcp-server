name: Caddy security candidate
on:
  pull_request:
    paths:
      - "deploy/foundry-test/caddy-security/**"
      - ".github/workflows/caddy-security-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caddy-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DOCKER_BUILDKIT: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check recipe without building
        run: node --test deploy/foundry-test/caddy-security/recipe.test.mjs
      - name: Record source identity and require resource-limit support
        run: |
          set -euo pipefail
          mkdir -p evidence
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const assert = require('node:assert/strict');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          assert.match(sha, /^[a-f0-9]{40}$/);
          assert.equal(sha, process.env.SOURCE_SHA);
          const info = JSON.parse(execFileSync('docker', ['info', '--format', '{{json .}}'], {encoding: 'utf8'}));
          const limits = Object.fromEntries(['MemoryLimit', 'SwapLimit', 'CpuCfsPeriod', 'CpuCfsQuota'].map(key => [key, info[key]]));
          for (const [key, enabled] of Object.entries(limits)) assert.equal(enabled, true, `${key} is required; do not fall back to an unbounded builder`);
          fs.writeFileSync('evidence/source.json', JSON.stringify({repository: process.env.SOURCE_REPOSITORY, sourceSha: sha, run: process.env.SOURCE_RUN, platform: 'linux/amd64', limits}, null, 2));
          NODE
          docker version > evidence/docker-version.txt
      - name: Build with hard CPU and memory limits
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --pull --force-rm \
            --memory 2g --memory-swap 2g --cpu-period 100000 --cpu-quota 100000 \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --iidfile evidence/image-id.txt --tag bossforge-caddy:security-candidate \
            deploy/foundry-test/caddy-security 2>&1 | tee evidence/build.log
          if grep -Eiq 'not support.*(memory|swap|cpu)|ignoring.*(memory|swap|cpu)' evidence/build.log; then
            echo 'Required build resource limits were not honored.' >&2
            exit 1
          fi
      - name: Save the exact image and non-secret build evidence
        run: |
          set -euo pipefail
          image_id="$(<evidence/image-id.txt)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker image inspect "$image_id" > evidence/image-inspect.json
          docker image save --output evidence/image.tar "$image_id"
          docker run --rm --network none --read-only --entrypoint caddy "$image_id" version > evidence/caddy-version.txt
          docker run --rm --network none --read-only --entrypoint caddy "$image_id" list-modules --packages --versions > evidence/module-versions.txt
          docker run --rm --network none --read-only --entrypoint cat "$image_id" /usr/local/share/caddy-security/go-buildinfo.txt > evidence/go-buildinfo.txt
      - name: Download checksum-pinned scanner and scan saved image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caddy-trivy" "$RUNNER_TEMP/caddy-trivy-cache"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/caddy-trivy/trivy.tar.gz"
          printf '%s  %s\n' '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' "$RUNNER_TEMP/caddy-trivy/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/caddy-trivy/trivy.tar.gz" -C "$RUNNER_TEMP/caddy-trivy" trivy
          "$RUNNER_TEMP/caddy-trivy/trivy" image --input evidence/image.tar \
            --platform linux/amd64 --scanners vuln --disable-telemetry --list-all-pkgs \
            --cache-dir "$RUNNER_TEMP/caddy-trivy-cache" --timeout 10m --no-progress \
            --format json --output evidence/trivy.json 2>&1 | tee evidence/scan.log
          "$RUNNER_TEMP/caddy-trivy/trivy" version --cache-dir "$RUNNER_TEMP/caddy-trivy-cache" --format json > evidence/scanner-version.json
          cp "$RUNNER_TEMP/caddy-trivy-cache/db/metadata.json" evidence/scanner-db.json
      - name: Verify image identity, patched Go runtime, and targeted advisory removal
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const imageId = fs.readFileSync('evidence/image-id.txt', 'utf8').trim();
          const report = JSON.parse(fs.readFileSync('evidence/trivy.json', 'utf8'));
          const image = JSON.parse(fs.readFileSync('evidence/image-inspect.json', 'utf8'))[0];
          assert.equal(report.Metadata.ImageID, imageId, 'scan must refer to the exact saved candidate');
          assert.equal(image.Id, imageId);
          assert.equal(image.Os, 'linux');
          assert.equal(image.Architecture, 'amd64');
          assert.equal(image.Config.Labels['org.opencontainers.image.revision'], process.env.SOURCE_SHA);
          assert.equal(image.Config.Labels['org.opencontainers.image.source'], `https://github.com/${process.env.SOURCE_REPOSITORY}`);
          assert.ok(Array.isArray(report.Results) && report.Results.length > 0, 'scan results are required');
          const binary = report.Results.find(result => result.Type === 'gobinary' && result.Target === 'usr/bin/caddy');
          assert.ok(binary, 'the final Caddy executable must be scanned');
          assert.ok(binary.Packages?.some(pkg => pkg.Name === 'stdlib' && pkg.Version === 'v1.26.8'), 'scanned binary must embed Go 1.26.8');
          assert.equal(fs.readFileSync('evidence/go-buildinfo.txt', 'utf8').split(/\r?\n/)[0], '/usr/bin/caddy: go1.26.8');
          assert.match(fs.readFileSync('evidence/caddy-version.txt', 'utf8'), /^v2\.11\.4(?:\s|$)/);
          const findings = report.Results.flatMap(result => result.Vulnerabilities ?? []);
          assert.ok(!findings.some(finding => finding.VulnerabilityID === 'CVE-2026-56862'), 'targeted TLS advisory remains');
          const remaining = findings.filter(finding => ['CRITICAL', 'HIGH'].includes(finding.Severity)).map(({VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity}) => ({VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity}));
          fs.writeFileSync('evidence/remaining-critical-high.json', JSON.stringify(remaining, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Candidate ${imageId} built from ${process.env.SOURCE_SHA}. Targeted TLS advisory absent; ${remaining.length} other critical/high package matches require manual triage. This is not deployment approval.\n`);
          NODE
      - name: Checksum available evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -d evidence ]; then
            (cd evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          fi
      - name: Upload candidate and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caddy-security-candidate-${{ env.SOURCE_SHA }}
          path: evidence/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
